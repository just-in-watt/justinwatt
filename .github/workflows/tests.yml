name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: python -m pip install -r requirements.txt

      - name: Vérifier la syntaxe
        run: |
          python - <<'PY'
          import ast
          import os
          import subprocess
          from pathlib import Path

          suivis = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.py"]
          ).split(b"\0")
          fichiers = [Path(os.fsdecode(chemin)) for chemin in suivis if chemin]

          for fichier in fichiers:
              ast.parse(fichier.read_text(encoding="utf-8"), filename=str(fichier))

          print(f"{len(fichiers)} fichiers Python valides")
          PY

      - name: Vérifier les données publiables
        run: python -m modules.audit_publication

      - name: Vérifier le mode lecture seule
        run: python -m modules.audit_securite

      - name: Lancer les tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
